<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-lens workbench</title>
<style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --ink:#23241f; --muted:#8a8d83;
    --line:#e7e6e0; --hairline:#f0efe9; --accent:#0e7a6d; --accent-ink:#fff;
    --accent-soft:#0e7a6d14; --warn:#b23c3c; --sel:#0e7a6d; --out:#6b57a8;
    --gold:#e7b400; --shadow:0 1px 2px #0000000a, 0 4px 14px #00000008;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141511; --panel:#1c1e19; --ink:#e9e9e3; --muted:#93968b;
      --line:#30322b; --hairline:#26281f; --accent:#3fbdae; --accent-ink:#0c211d;
      --accent-soft:#3fbdae1c; --warn:#e08585; --sel:#3fbdae; --out:#b3a1e8;
      --shadow:0 1px 2px #0006; }
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{height:9px;width:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}

  header{padding:10px 18px;display:flex;gap:12px;align-items:center;
         flex-wrap:wrap;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;letter-spacing:.01em}
  header .badge{background:var(--accent-soft);color:var(--accent);
    border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}

  #promptbar{display:flex;gap:10px;padding:12px 18px 8px;align-items:flex-start;
             flex-wrap:wrap}
  textarea{flex:1;min-width:320px;min-height:42px;resize:vertical;
           background:var(--panel);color:var(--ink);border:1px solid var(--line);
           border-radius:var(--r);padding:9px 12px;font:inherit;
           box-shadow:var(--shadow)}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-soft);
           border-color:var(--accent)}
  button{background:var(--accent);color:var(--accent-ink);border:0;
         border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;
         cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--accent);
               border:1px solid var(--accent);font-weight:500}
  button.ghost:hover{background:var(--accent-soft);filter:none}
  button:disabled{opacity:.5;cursor:default}
  button.busy::after{content:"…";display:inline-block;
    animation:dots 1s steps(4) infinite;width:1.2em;text-align:left}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  select,input[type=text],input[type=number]{background:var(--panel);
    color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font:inherit}
  label.opt{color:var(--muted);font-size:12.5px;display:flex;gap:6px;
            align-items:center;white-space:nowrap}
  #adv{font-size:12.5px;flex-basis:100%}
  #adv summary{cursor:pointer;color:var(--muted);width:max-content;
               padding:2px 0}
  #adv .row{margin-top:6px}
  #examples{display:flex;gap:7px;align-items:center;padding:2px 18px 10px;
            flex-wrap:wrap}
  #examples .hint{margin-right:2px}
  #replybox{margin:0 18px 8px;padding:9px 13px;background:var(--panel);
            border:1px solid var(--line);border-radius:var(--r);
            box-shadow:var(--shadow);font-size:13px}
  #replybox #replytext{font-family:ui-monospace,Menlo,monospace;
            white-space:pre-wrap}
  #status{color:var(--muted);font-size:12px;padding:0 18px 6px;min-height:16px}
  #status.err{color:var(--warn)}

  #layout{display:flex;align-items:flex-start;gap:0}
  #left{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;
        padding:0 12px 20px 18px}
  #gridwrap{overflow:auto;max-height:56vh;background:var(--panel);
            border:1px solid var(--line);border-radius:var(--r);
            box-shadow:var(--shadow)}
  table{border-collapse:separate;border-spacing:0;
        font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
  th,td{padding:3px 8px;white-space:nowrap;text-align:left;border:0}
  thead th{position:sticky;top:0;background:var(--panel);z-index:3;
           font-weight:650;color:var(--accent);cursor:pointer;
           box-shadow:inset 0 -2px 0 var(--line)}
  thead th.gen{color:var(--out);box-shadow:inset 0 -2px 0 var(--out)}
  tbody th{position:sticky;left:0;background:var(--panel);z-index:2;
           color:var(--muted);font-weight:500;
           box-shadow:inset -2px 0 0 var(--hairline)}
  tbody th.band{color:var(--accent);font-weight:700}
  tbody td{border-bottom:1px solid var(--hairline)}
  tbody tr:hover td{filter:brightness(.97)}
  tbody tr.outrow td{color:var(--out);font-style:italic;
    border-top:2px solid var(--line)}
  tbody tr.outrow th{color:var(--out);font-weight:700;
    border-top:2px solid var(--line)}
  td{cursor:pointer;max-width:118px;overflow:hidden;text-overflow:ellipsis;
     border-radius:4px}
  td.sel{outline:2px solid var(--sel);outline-offset:-2px;border-radius:5px}
  td sup{color:var(--muted);font-size:8.5px;margin-left:1px}

  #pinsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #pinsbar input{min-width:170px}
  .chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;
        padding:4px 12px;font:12.5px ui-monospace,monospace;cursor:pointer;
        border:2px solid transparent;color:#1e1e1e;font-weight:600;
        box-shadow:var(--shadow)}
  .chip.active{border-color:var(--ink)}
  .chip b{cursor:pointer;opacity:.55;font-weight:800}
  .chip b:hover{opacity:1}

  #charts{display:flex;gap:12px;flex-wrap:wrap}
  .chart{background:var(--panel);border:1px solid var(--line);
         border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
  .chart h3{margin:0 0 4px;font-size:11.5px;color:var(--muted);
            font-weight:600;letter-spacing:.02em}
  svg text{fill:var(--muted);font:9.5px ui-monospace,monospace}
  svg .axis{stroke:var(--hairline)}
  svg .lbl{font-weight:700}

  #side{width:352px;flex-shrink:0;padding:0 18px 20px 6px;display:flex;
        flex-direction:column;gap:12px;max-height:calc(100vh - 150px);
        overflow:auto;position:sticky;top:0}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow)}
  .card h2{font-size:11px;margin:0 0 8px;text-transform:uppercase;
           letter-spacing:.08em;color:var(--muted);font-weight:700}
  .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:4px 0}
  .toklist div{display:flex;align-items:center;gap:5px;padding:2px 4px;
               font:12.5px ui-monospace,monospace;border-radius:6px}
  .toklist div:hover{background:var(--accent-soft)}
  .toklist .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:pre}
  .toklist .s{color:var(--muted);min-width:48px;text-align:right;
              font-variant-numeric:tabular-nums}
  .mini{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
  .toklist .mini{opacity:.35;padding:1px 6px}
  .toklist div:hover .mini{opacity:1}
  .slice{font:11.5px ui-monospace,monospace;max-height:160px;overflow-y:auto;
         overflow-x:hidden}
  .slice div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
             padding:1.5px 4px;border-radius:5px}
  .slice div:hover{background:var(--accent-soft)}
  .slice b{color:var(--accent);display:inline-block;width:36px;cursor:pointer}
  .cols{display:flex;gap:12px}
  .cols>div{flex:1;min-width:0}
  .bar{height:16px;background:var(--accent-soft);border-radius:5px;
       position:relative;margin:3px 0;overflow:hidden}
  .bar i{position:absolute;inset:0;background:var(--accent);opacity:.5;
         border-radius:5px}
  .bar span{position:relative;z-index:1;font:11px ui-monospace,monospace;
            padding:0 5px;white-space:pre;line-height:16px}
  .gen{font:12px ui-monospace,monospace;background:var(--bg);border-radius:8px;
       padding:7px 9px;margin-top:6px;white-space:pre-wrap;
       word-break:break-word;max-height:110px;overflow:auto;
       border:1px solid var(--hairline)}
  .tag{font-size:11px;color:var(--accent);text-transform:none;
       letter-spacing:0;font-weight:500}
  .hint{color:var(--muted);font-size:12px}
  #tt{position:fixed;background:var(--panel);border:1px solid var(--line);
      border-radius:9px;padding:7px 11px;font:11.5px ui-monospace,monospace;
      pointer-events:none;display:none;z-index:10;max-width:300px;
      box-shadow:0 6px 24px #00000030}
  #tt .h{color:var(--accent);margin-bottom:4px;font-weight:700}
  #tt .pr{margin-top:2px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>J-lens workbench</h1>
  <span class="badge" id="modelinfo">ready</span>
  <span class="sub">click cells · ←→↑↓ to move · pin words for rank heatmap + charts · swap thoughts live</span>
</header>

<div id="promptbar">
  <textarea id="prompt" placeholder="Send a message and see what pops up in the model's workspace…">On which continent is the country famous for the pyramids of Giza? Reply with just the name.</textarea>
  <label class="opt">
    <select id="analyze">
      <option value="reply" selected>message → model replies</option>
      <option value="chat">chat prompt only</option>
      <option value="raw">raw completion</option>
    </select></label>
  <button id="readbtn" onclick="doRead()">Read</button>
  <details id="adv"><summary class="hint">advanced</summary>
    <div class="row"><label class="opt">readout
      <select id="mode"><option value="cosine" selected>cosine</option>
        <option value="raw">raw logits</option></select></label>
      <label class="opt"><input type="checkbox" id="wordsonly"> words only</label>
      <label class="opt"><input type="checkbox" id="ws"> raw whitespace</label></div>
    <div class="row"><label class="opt">prefill assistant
      <input type="text" id="prefill" size="18"
        placeholder='e.g. "Certainly!"'></label>
      <label class="opt">reply tokens <input type="number" id="maxnew"
        value="48" style="width:58px"></label>
      <button class="mini ghost" onclick="exportJSON()">export JSON</button></div>
  </details>
</div>
<div id="examples">
  <span class="hint">try:</span>
  <button class="mini ghost" onclick="loadExample(0)">pyramids → continent</button>
  <button class="mini ghost" onclick="loadExample(1)">spider legs</button>
  <button class="mini ghost" onclick="loadExample(2)">Winograd trophy</button>
  <button class="mini ghost" onclick="loadExample(3)">hidden language</button>
  <button class="mini ghost" onclick="loadExample(4)">think of a sport</button>
</div>
<div id="replybox" hidden><span class="hint" id="replylabel">model reply:</span>
  <span id="replytext"></span></div>
<div id="status"></div>
<div id="tt"></div>

<div id="layout">
  <div id="left">
    <div id="gridwrap"><table id="grid"></table></div>
    <div id="pinsbar">
      <input type="text" id="pinword" placeholder="pin a word… e.g. Egypt"
             size="16" onkeydown="if(event.key==='Enter')doPin()">
      <button class="mini" onclick="doPin()">Pin</button>
      <span id="chips"></span>
      <span class="hint" id="pinstate"></span>
    </div>
    <div id="charts" hidden>
      <div class="chart"><h3 id="clh"></h3><div id="chartLayer"></div></div>
      <div class="chart"><h3 id="cph"></h3><div id="chartPos"></div></div>
      <div id="minimaps" style="display:contents"></div>
    </div>
  </div>

  <div id="side">
    <div class="card">
      <h2>Cell detail <span class="tag" id="cellpos"></span></h2>
      <div class="toklist" id="detail"><span class="hint">Click a grid cell.</span></div>
    </div>
    <div class="card">
      <h2>Across layers <span class="tag" id="bylh"></span></h2>
      <div class="slice" id="bylayer"><span class="hint">Select a cell.</span></div>
    </div>
    <div class="card">
      <h2>Across positions <span class="tag" id="byph"></span></h2>
      <div class="slice" id="bypos"><span class="hint">Select a cell.</span></div>
    </div>
    <div class="card">
      <h2>Intervene</h2>
      <div class="row">
        <select id="kind" onchange="kindChanged()">
          <option value="clamp" selected>clamped swap (Fig. 13)</option>
          <option value="swap">swap (§2.5)</option>
          <option value="steer">steer (add concept)</option>
        </select>
      </div>
      <div class="row"><label class="opt">source</label>
        <input type="text" id="src" size="10" placeholder="Egypt"></div>
      <div class="row"><label class="opt">target</label>
        <input type="text" id="tgt" size="10" placeholder="France"></div>
      <div class="row">
        <label class="opt">α <input type="number" id="alpha" value="1.0"
          step="0.5" style="width:58px" disabled></label>
        <label class="opt">layers <input type="number" id="lo" style="width:54px">
          – <input type="number" id="hi" style="width:54px"></label>
      </div>
      <div class="row"><button onclick="doIntervene()" id="ivbtn">Apply</button>
        <span class="hint">A/B buttons fill source/target</span></div>
    </div>
    <div class="card" id="results" hidden>
      <h2>Result <span class="tag" id="ivlabel"></span></h2>
      <div class="cols">
        <div><strong class="hint">clean</strong><div id="cleantop"></div>
          <div class="gen" id="cleangen"></div></div>
        <div><strong class="hint">edited</strong><div id="edittop"></div>
          <div class="gen" id="editgen"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const PALETTE = ["#e7b400","#3f8cff","#e05555","#9a5fe0","#38b24d","#e07a2e"];
const EXAMPLES = [
 {p:"On which continent is the country famous for the pyramids of Giza? Reply with just the name.",
  pins:["Egypt","Africa","Europe"], a:"reply"},
 {p:"How many legs does the animal that spins webs have? Reply with just the number.",
  pins:["spider","ant"], a:"reply"},
 {p:"The trophy would not fit into the brown suitcase because it was far too large.",
  pins:["trophy","suitcase"], a:"raw"},
 {p:"La lluvia caía despacio sobre los tejados del pueblo y nadie salió a la calle.\n\nWhat language is this passage written in? Answer with one word.",
  pins:["Spanish","French"], a:"reply"},
 {p:"Think of a sport. Do not explain your reasoning. Reply with only its name.",
  pins:[], a:"reply"},
];
async function loadExample(i){
  const e = EXAMPLES[i];
  $("prompt").value = e.p; $("analyze").value = e.a;
  await doRead();
  for (const w of e.pins){ $("pinword").value = w; await doPin(); }
  if (S.pins.length) setActive(0);
}
function exportJSON(){
  if (!S.data) return;
  const blob = new Blob([JSON.stringify({data:S.data,
    pins:S.pins.map(p=>({word:p.word, ranks:p.ranks}))}, null, 1)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "jlens-snapshot.json";
  a.click();
}
let S = {data:null, pins:[], active:-1, sel:null};
const $ = id => document.getElementById(id);
const status = (m,e)=>{ $("status").textContent=m; $("status").className=e?"err":""; };

async function api(route, body){
  const r = await fetch("/api/"+route,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const vis = s => $("ws").checked ? s :
  (s.trim()==="" ? (s.includes("\n") ? "⏎" : "·") : s.replaceAll("\n","⏎"));

// ---- grid ------------------------------------------------------------------
function cellStyle(li,pi){
  if (S.active >= 0){
    const r = S.pins[S.active].ranks[li][pi];
    if (r > 5000) return "";
    const a = Math.min(.82, Math.max(.12, 1 - Math.log10(r)/3.7));
    return `background:${S.pins[S.active].color}${
      Math.round(a*255).toString(16).padStart(2,"0")}${
      a > .4 ? ";color:#1e1e1e" : ""}`;
  }
  const c = S.data.grid[li][pi], m = S.max || 1;
  const a = Math.max(0, c.s/m)*0.42;
  return `background:rgba(11,110,100,${a.toFixed(2)})`;
}
function renderGrid(){
  const d = S.data, band = d.band;
  S.max = Math.max(...d.grid.flat().map(c=>c.s));
  let h = "<thead><tr><th></th>";
  d.tokens.forEach((t,i)=> h +=
    `<th class="${d.asst_start!==null && i>=d.asst_start ? 'gen':''}"
       title="${d.asst_start!==null && i>=d.asst_start ? 'assistant turn':'prompt'}"
       onclick="selectCell(S.sel?S.sel[0]:${d.layers.length-1},${i})">${esc(vis(t))}</th>`);
  h += "</tr></thead><tbody>";
  d.layers.forEach((L,li)=>{
    h += `<tr><th class="${L>=band[0]&&L<=band[1]?'band':''}">L${L}</th>`;
    d.tokens.forEach((_,pi)=>{
      const c = d.grid[li][pi];
      const sup = c.r>1 ? `<sup>${c.r}</sup>` : "";
      h += `<td style="${cellStyle(li,pi)}" id="c-${li}-${pi}"
        onclick="selectCell(${li},${pi})" onmousemove="tt(event,${li},${pi})"
        onmouseleave="ttHide()">${esc(vis(c.t))}${sup}</td>`;
    });
    h += "</tr>";
  });
  h += `<tr class="outrow"><th title="the model's actual next-token prediction">OUT</th>`;
  d.outrow.forEach((c,pi)=> h += `<td onmousemove="ttOut(event,${pi})"
      onmouseleave="ttHide()">${esc(vis(c.t))}</td>`);
  h += "</tr></tbody>";
  $("grid").innerHTML = h;
  markSel();
}
function markSel(){
  document.querySelectorAll("td.sel").forEach(e=>e.classList.remove("sel"));
  if (!S.sel) return;
  const el = $(`c-${S.sel[0]}-${S.sel[1]}`);
  if (el){ el.classList.add("sel");
    el.scrollIntoView({block:"nearest", inline:"nearest"}); }
}
function tt(e, li, pi){
  const c = S.data.grid[li][pi];
  let rows = c.t3.map((t,i)=>`<div>${i+1+ (c.r-1)}. ${esc(vis(t))}</div>`).join("");
  let pr = S.pins.map(p=>`<div class="pr" style="color:${p.color}">
      ${esc(p.word)} rank ${p.ranks[li][pi]}</div>`).join("");
  showTT(e, `<div class="h">L${S.data.layers[li]} · pos ${pi}</div>${rows}${pr}`);
}
function ttOut(e, pi){
  const c = S.data.outrow[pi];
  showTT(e, `<div class="h">model output · pos ${pi}</div>
    <div>${esc(vis(c.t))} &nbsp;p=${c.p}</div>`);
}
function showTT(e, html){
  const el = $("tt"); el.innerHTML = html; el.style.display = "block";
  el.style.left = Math.min(innerWidth-300, e.clientX+14)+"px";
  el.style.top = Math.max(4, e.clientY-el.offsetHeight-10)+"px";
}
function ttHide(){ $("tt").style.display = "none"; }

async function doRead(){
  status($("analyze").value==="reply"
    ? "Generating the reply, then reading its workspace…"
    : "Reading… (one forward pass + a lens readout per layer)");
  $("readbtn").disabled = true; $("readbtn").classList.add("busy");
  try{
    const az = $("analyze").value;
    S.data = await api("read",{prompt:$("prompt").value, chat:az!=="raw",
      reply:az==="reply", prefill:$("prefill").value,
      max_new:parseInt($("maxnew").value||"48"),
      cosine:$("mode").value==="cosine", words_only:$("wordsonly").checked});
    S.pins = []; S.active = -1; S.sel = null;
    $("lo").value = S.data.band[0]; $("hi").value = S.data.band[1];
    $("replybox").hidden = !S.data.reply;
    $("replylabel").textContent =
      (S.info ? S.info.model.split("/").pop() : "model") + " replies: ";
    $("replytext").textContent = S.data.reply || "";
    renderGrid(); renderChips(); renderCharts();
    status(`${S.data.tokens.length} tokens × ${S.data.layers.length} layers · band L${S.data.band[0]}–L${S.data.band[1]} · OUT row = model's real prediction` +
      (S.data.reply ? " · purple header columns = the model's own reply" : ""));
  }catch(e){ status(e.message,true); }
  $("readbtn").disabled = false; $("readbtn").classList.remove("busy");
}

// ---- selection + slices ----------------------------------------------------
async function selectCell(li, pi){
  S.sel = [li, pi]; markSel(); renderCharts();
  const L = S.data.layers[li];
  $("cellpos").textContent = `L${L} · pos ${pi} (${vis(S.data.tokens[pi])})`;
  $("bylh").textContent = `at pos ${pi}`;
  $("byph").textContent = `at L${L}`;
  try{
    const cos = $("mode").value === "cosine";
    const d = await api("detail",{layer:L,pos:pi,cosine:cos});
    $("detail").innerHTML = d.top.map(r=>`
      <div><span class="t">${esc(vis(r.tok))}</span>
        <span class="s">${r.score.toFixed(3)}</span>
        <button class="mini ghost" title="pin this token"
          onclick='pinWord(${JSON.stringify(r.tok)})'>pin</button>
        <button class="mini ghost" title="use as swap source"
          onclick='$("src").value=${JSON.stringify(r.tok)}'>A</button>
        <button class="mini ghost" title="use as swap target"
          onclick='$("tgt").value=${JSON.stringify(r.tok)}'>B</button>
      </div>`).join("");
    const sl = await api("slice",{layer:L,pos:pi,cosine:cos});
    $("bylayer").innerHTML = sl.bylayer.map((row,i)=>
      `<div><b onclick="selectCell(${i},${pi})">L${S.data.layers[i]}</b> ${
        row.map(t=>esc(vis(t))).join("  ")}</div>`).join("");
    $("bypos").innerHTML = sl.bypos.map((row,i)=>
      `<div><b onclick="selectCell(${li},${i})">${i}</b> ${
        row.map(t=>esc(vis(t))).join("  ")}</div>`).join("");
  }catch(e){ status(e.message,true); }
}
document.addEventListener("keydown", e=>{
  if (!S.sel || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const [li,pi] = S.sel, L = S.data.layers.length, T = S.data.tokens.length;
  const mv = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if (!mv) return;
  e.preventDefault();
  selectCell(Math.min(L-1,Math.max(0,li+mv[0])), Math.min(T-1,Math.max(0,pi+mv[1])));
});

// ---- pins ------------------------------------------------------------------
async function pinWord(w){ $("pinword").value = w.trim(); await doPin(); }
async function doPin(){
  const w = $("pinword").value.trim();
  if (!w || !S.data) return;
  if (S.pins.some(p=>p.word===w)){ S.active = S.pins.findIndex(p=>p.word===w);
    renderChips(); renderGrid(); renderCharts(); return; }
  status(`Ranking ${JSON.stringify(w)} at every cell…`);
  try{
    const r = await api("pin",{word:w});
    r.color = PALETTE[S.pins.length % PALETTE.length];
    S.pins.push(r); S.active = S.pins.length-1;
    $("pinword").value = "";
    renderChips(); renderGrid(); renderCharts(); status("");
  }catch(e){ status(e.message,true); }
}
function setActive(i){ S.active = (S.active===i? -1 : i);
  renderChips(); renderGrid(); renderCharts(); }
function unpin(i){ S.pins.splice(i,1);
  if (S.active>=S.pins.length) S.active = S.pins.length-1;
  renderChips(); renderGrid(); renderCharts(); }
function renderChips(){
  $("chips").innerHTML = S.pins.map((p,i)=>`
    <span class="chip ${i===S.active?'active':''}" style="background:${p.color}"
      onclick="setActive(${i})">${esc(p.word)}
      <b onclick="event.stopPropagation();unpin(${i})">×</b></span>`).join("");
  $("pinstate").textContent = S.pins.length
    ? (S.active>=0
       ? `grid overlay: ${S.pins[S.active].word} — full heat-maps below ↓`
       : "heat-maps below ↓ · click a chip to also overlay it on the grid")
    : "grid colours by readout strength · pin a word for heat-maps";
}

// ---- rank line charts ------------------------------------------------------
function rankChart(xs, series, xticks, onclickFmt){
  const W = Math.max(300, Math.min(560, xs.length*13+90)), H = 160,
        mL = 34, mB = 16, mT = 6, mR = 6;
  const ymax = Math.log10(S.data.vocab || 150000);
  const X = i => mL + (W-mL-mR) * (xs.length<2 ? .5 : i/(xs.length-1));
  const Y = r => mT + (H-mT-mB) * Math.log10(Math.max(1,r)) / ymax;
  let g = `<svg width="${W}" height="${H}">`;
  [1,10,100,1000,10000].forEach(r=>{
    g += `<line class="axis" x1="${mL}" x2="${W-mR}" y1="${Y(r)}" y2="${Y(r)}"/>
          <text x="2" y="${Y(r)+3}">${r>=1000? r/1000+"k" : r}</text>`; });
  xticks.forEach(([i,lab])=> g += `<text x="${X(i)-6}" y="${H-3}">${lab}</text>`);
  series.forEach((s,si)=>{
    const pts = s.vals.map((r,i)=>`${X(i)},${Y(r)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}"
           stroke-width="2.2" stroke-linejoin="round" opacity=".9"/>`;
    if (s.vals.length <= 40)
      s.vals.forEach((r,i)=> g += `<circle cx="${X(i)}" cy="${Y(r)}" r="2"
        fill="${s.color}"/>`);
    if (s.name) g += `<text class="lbl" fill="${s.color}" style="fill:${s.color}"
        x="${X(s.vals.length-1)+3}" y="${Y(s.vals[s.vals.length-1])+3}"
        >${s.name}</text>`;
  });
  if (S.sel && onclickFmt !== undefined){
    g += `<line class="axis" x1="${X(onclickFmt)}" x2="${X(onclickFmt)}"
          y1="${mT}" y2="${H-mB}" stroke-dasharray="3 3"/>`;
  }
  return g + "</svg>";
}
function renderMinimaps(){
  const wrap = $("minimaps");
  const L = S.data.layers.length, T = S.data.tokens.length;
  const cw = Math.max(4, Math.min(9, Math.floor(520/T))), ch = 5;
  wrap.innerHTML = S.pins.map((p,i)=>`<div class="chart">
    <h3><span style="color:${p.color}">■</span> ${esc(p.word)} — rank heat-map
      <span class="hint">(rows L${S.data.layers[0]}–L${S.data.layers[L-1]},
      click to jump)</span></h3>
    <canvas id="mm-${i}" width="${T*cw}" height="${L*ch}"
      style="cursor:pointer;display:block"></canvas></div>`).join("");
  S.pins.forEach((p,i)=>{
    const cv = $("mm-"+i), ctx = cv.getContext("2d");
    for (let li=0; li<L; li++) for (let pi=0; pi<T; pi++){
      const r = p.ranks[li][pi];
      ctx.globalAlpha = r>5000 ? 0.05 : Math.max(.15, 1-Math.log10(r)/3.7);
      ctx.fillStyle = p.color;
      ctx.fillRect(pi*cw, li*ch, cw-0.6, ch-0.6);
    }
    ctx.globalAlpha = 0.9; ctx.strokeStyle = "#888"; ctx.setLineDash([2,2]);
    [S.data.band[0], S.data.band[1]+1].forEach(B=>{
      const y = S.data.layers.indexOf(B) * ch;
      if (y >= 0){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(T*cw, y);
                   ctx.stroke(); }
    });
    cv.onclick = e => { const b = cv.getBoundingClientRect();
      selectCell(Math.min(L-1, Math.floor((e.clientY-b.top)/ch)),
                 Math.min(T-1, Math.floor((e.clientX-b.left)/cw))); };
    cv.onmousemove = e => { const b = cv.getBoundingClientRect();
      const li = Math.min(L-1, Math.floor((e.clientY-b.top)/ch)),
            pi = Math.min(T-1, Math.floor((e.clientX-b.left)/cw));
      showTT(e, `<div class="h">L${S.data.layers[li]} · pos ${pi} (${
        esc(vis(S.data.tokens[pi]))})</div><div style="color:${p.color}">${
        esc(p.word)} rank ${p.ranks[li][pi]}</div>`); };
    cv.onmouseleave = ttHide;
  });
}
function renderCharts(){
  if (!S.pins.length || !S.data){ $("charts").hidden = true; return; }
  $("charts").hidden = false;
  renderMinimaps();
  const [li, pi] = S.sel || [0, S.data.tokens.length-1];
  const Ls = S.data.layers, T = S.data.tokens.length;
  $("clh").textContent = `rank vs layer · at pos ${pi} (${vis(S.data.tokens[pi])})`;
  $("chartLayer").innerHTML = rankChart(Ls,
    S.pins.map(p=>({color:p.color, name:p.word, vals:Ls.map((_,i)=>p.ranks[i][pi])})),
    Ls.map((L,i)=> i%4===0 ? [i,"L"+L] : null).filter(Boolean), li);
  $("cph").textContent = `rank vs position · at L${Ls[li]}`;
  $("chartPos").innerHTML = rankChart([...Array(T).keys()],
    S.pins.map(p=>({color:p.color, name:p.word, vals:p.ranks[li]})),
    [...Array(T).keys()].map(i=> i%5===0 ? [i,""+i] : null).filter(Boolean), pi);
}

// ---- interventions ---------------------------------------------------------
function kindChanged(){
  const k = $("kind").value;
  $("alpha").disabled = (k === "clamp");
  $("src").disabled = (k === "steer");
}
const bars = top => top.map(t=>`<div class="bar">
  <i style="width:${(t.p*100).toFixed(1)}%"></i>
  <span>${esc(vis(t.tok))} ${(t.p*100).toFixed(1)}%</span></div>`).join("");
async function doIntervene(){
  if (!S.data){ status("read a prompt first", true); return; }
  $("ivbtn").disabled = true;
  status("Intervening… (two forward passes + two generations)");
  try{
    const r = await api("intervene",{kind:$("kind").value, source:$("src").value,
      target:$("tgt").value, alpha:parseFloat($("alpha").value||"1"),
      lo:parseInt($("lo").value), hi:parseInt($("hi").value)});
    $("results").hidden = false;
    $("ivlabel").textContent = `${r.label} @ L${r.layers[0]}–L${r.layers[1]}`;
    $("cleantop").innerHTML = bars(r.clean.top);
    $("edittop").innerHTML = bars(r.edited.top);
    $("cleangen").textContent = r.clean.gen;
    $("editgen").textContent = r.edited.gen;
    status("");
  }catch(e){ status(e.message,true); }
  $("ivbtn").disabled = false;
}
$("ws").addEventListener("change", ()=>{ if (S.data){ renderGrid(); }});

// show which model + lens this server is running, before any Read
(async ()=>{ try{
  const r = await fetch("/api/info"); const i = await r.json();
  S.info = i;
  $("modelinfo").textContent =
    `${i.model} · lens: ${i.lens_file} (${i.lens_prompts} prompts) · ${i.device}`;
  document.title = `J-lens — ${i.model.split("/").pop()}`;
}catch(e){} })();
</script>
